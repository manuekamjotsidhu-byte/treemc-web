<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Hexagon / Rounded Diamond -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="#0d1117" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5" />
  
  <!-- Circuit Nodes & Gridlines -->
  <path d="M12 24h6M30 24h6M24 10v4M24 38v-4" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Geometric Tree MC Emblem -->
  <!-- Top Tier (Apex) -->
  <polygon points="24,9 31,18 17,18" fill="url(#treeGrad)" filter="url(#glow)" />
  <!-- Middle Tier -->
  <polygon points="24,15 35,26 13,26" fill="url(#treeGrad)" opacity="0.9" />
  <!-- Lower Tier -->
  <polygon points="24,22 38,34 10,34" fill="url(#treeGrad)" opacity="0.8" />
  
  <!-- Tech Trunk / Server Node -->
  <rect x="22" y="34" width="4" height="6" rx="1.5" fill="url(#trunkGrad)" />
  
  <!-- Glowing Data Point Cores -->
  <circle cx="24" cy="18" r="1.5" fill="#a7f3d0" />
  <circle cx="18" cy="26" r="1.5" fill="#a7f3d0" />
  <circle cx="30" cy="26" r="1.5" fill="#a7f3d0" />
  <circle cx="24" cy="30" r="1.5" fill="#ffffff" />
</svg>
