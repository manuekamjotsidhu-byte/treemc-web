<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page Not Found | TreeMC</title>
  <meta http-equiv="refresh" content="3;url=/">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .nf-card {
      max-width: 480px;
      width: 100%;
      padding: 40px 28px;
      border-radius: 20px;
      background: var(--card, #111622);
      border: 1px solid var(--border, rgba(255, 255, 255, .12));
    }

    .nf-code {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin: 0 0 12px;
      color: #a3e635;
    }

    .nf-card h1 {
      font-size: 1.5rem;
      margin: 0 0 10px;
    }

    .nf-card p {
      opacity: .8;
      margin: 0 0 22px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="nf-wrap">
    <div class="nf-card">
      <div class="nf-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you requested does not exist. Redirecting you to the TreeMC homepage in <span id="cd">3</span>s…</p>
      <a class="btn btn-lime" href="/">Go to Homepage</a>
    </div>
  </div>
  <script>
    let s = 3;
    const el = document.getElementById("cd");
    setInterval(() => { s--; if (s >= 0 && el) el.textContent = s; if (s <= 0) window.location.replace("/"); }, 1000);
  </script>
</body>

</html>
